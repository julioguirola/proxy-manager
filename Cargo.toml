[package]
name = "proxy-manager"
version = "0.1.0"
edition = "2024"
description = "Configurador de proxy del sistema (TUI en Rust)"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
